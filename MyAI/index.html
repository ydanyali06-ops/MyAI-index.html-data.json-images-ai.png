<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My AI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#050509;
color:white;
font-family:Arial,sans-serif
}

.app{
max-width:900px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
background:#0d0d14
}

header{
padding:14px;
display:flex;
align-items:center;
gap:12px;
background:linear-gradient(135deg,#17172b,#101018);
border-bottom:1px solid #29293a
}

.logo{
width:52px;
height:52px;
border-radius:50%;
object-fit:cover;
background:#222
}

.title{
font-size:21px;
font-weight:bold
}

.status{
color:#4ade80;
font-size:12px;
margin-top:4px
}

#chat{
flex:1;
overflow-y:auto;
padding:15px
}

.msg{
max-width:88%;
padding:12px 15px;
margin:9px 0;
border-radius:17px;
line-height:1.8;
white-space:pre-wrap;
word-break:break-word
}

.user{
margin-right:auto;
background:#27273a
}

.ai{
margin-left:auto;
background:#171722;
border:1px solid #303044
}

.tools{
display:flex;
gap:7px;
overflow-x:auto;
padding:8px;
background:#11111a
}

button{
border:0;
border-radius:12px;
padding:11px 14px;
color:white;
background:#292939;
cursor:pointer;
white-space:nowrap
}

.blue{background:#2563eb}
.red{background:#dc2626}

.inputBox{
display:flex;
gap:8px;
padding:10px;
background:#11111a
}

#input{
flex:1;
min-width:0;
padding:14px;
border:1px solid #303040;
outline:none;
border-radius:14px;
background:#20202c;
color:white;
font-size:15px
}

#file{
display:none
}

.image{
max-width:280px;
max-height:280px;
border-radius:15px
}
</style>
</head>

<body>

<div class="app">

<header>

<img
class="logo"
src="ai.png"
onerror="this.style.display='none'"
>

<div>
<div class="title">🤖 My AI</div>
<div class="status" id="status">
● در حال بارگذاری مغز...
</div>
</div>

</header>

<div id="chat"></div>

<div class="tools">

<button onclick="startMic()">🎤 میکروفن</button>

<button onclick="speakLast()">🔊 صدا</button>

<button onclick="pickImage()">🖼️ عکس</button>

<button onclick="showMemory()">🧠 حافظه</button>

<button onclick="showHelp()">❓ راهنما</button>

<button class="red" onclick="clearChat()">🗑️ پاک کردن</button>

</div>

<input
id="file"
type="file"
accept="image/*"
>

<div class="inputBox">

<input
id="input"
placeholder="پیامت را بنویس..."
autocomplete="off"
>

<button
class="blue"
onclick="send()"
>
ارسال
</button>

</div>

</div>

<script>

/* =========================
   🧠 مغز اصلی
========================= */

let brain={};

let learned=
JSON.parse(
localStorage.getItem("MY_AI_MEMORY") || "{}"
);

let history=
JSON.parse(
localStorage.getItem("MY_AI_CHAT") || "[]"
);

let lastAnswer="";


/* =========================
   تمیز کردن متن
========================= */

function clean(text){

return String(text)
.toLowerCase()
.trim()
.replace(/[؟?!،,.؛:]/g,"")
.replace(/\s+/g," ");

}


/* =========================
   📚 بارگذاری مغز
========================= */

async function loadBrain(){

try{

const response=
await fetch("data.json");

if(!response.ok)
throw new Error();

brain=
await response.json();

document.getElementById("status").textContent=
"● آماده | "+
Object.keys(brain).length+
" اطلاعات";

addMessage(
"🧠 مغز من آماده شد!\n"+
Object.keys(brain).length+
" اطلاعات از data.json بارگذاری شد.",
"ai"
);

}catch(error){

document.getElementById("status").textContent=
"● خطا در مغز";

addMessage(
"⚠️ فایل data.json پیدا نشد یا JSON آن اشتباه است.",
"ai"
);

}

}


/* =========================
   💬 پیام
========================= */

function addMessage(text,type){

const div=
document.createElement("div");

div.className="msg "+type;

div.textContent=text;

document
.getElementById("chat")
.appendChild(div);

scrollChat();

return div;

}


function scrollChat(){

const chat=
document.getElementById("chat");

chat.scrollTop=
chat.scrollHeight;

}


/* =========================
   💾 ذخیره چت
========================= */

function saveChat(){

localStorage.setItem(
"MY_AI_CHAT",
JSON.stringify(history)
);

}


/* =========================
   🧠 آموزش
========================= */

function teach(text){

let data=
text.substring(9).trim();

let parts=
data.split("|");

if(parts.length<2){

return "❌ فرمت درست:\nیاد بگیر: سؤال | جواب";

}

let question=
clean(parts[0]);

let answer=
parts.slice(1).join("|").trim();

if(!question || !answer)
return "❌ سؤال یا جواب خالی است.";

learned[question]=answer;

localStorage.setItem(
"MY_AI_MEMORY",
JSON.stringify(learned)
);

return "✅ یاد گرفتم!\n\n"+answer;

}


/* =========================
   🔎 پیدا کردن جواب
========================= */

function findAnswer(text){

let q=clean(text);


/* حافظه شخصی */

if(learned[q])
return learned[q];


/* مغز اصلی */

if(brain[q])
return brain[q];


/* جستجوی تقریبی در حافظه */

for(const key in learned){

if(
q.includes(key) ||
key.includes(q)
){

return learned[key];

}

}


/* جستجوی تقریبی در مغز */

for(const key in brain){

if(
q.includes(key) ||
key.includes(q)
){

return brain[key];

}

}

return null;

}


/* =========================
   🧮 ماشین حساب
========================= */

function calculator(text){

let x=
text
.replace("حساب کن","")
.replace("محاسبه کن","")
.trim();

if(
!/^[0-9+\-*/().%\s]+$/.test(x)
)
return null;

try{

let result=
Function(
'"use strict";return ('+
x+
')'
)();

if(Number.isFinite(result))
return "🧮 جواب: "+result;

}catch(e){}

return null;

}


/* =========================
   🤖 پاسخ
========================= */

function answer(text){

let q=clean(text);


/* آموزش */

if(
text.trim().startsWith("یاد بگیر:")
){

return teach(text);

}


/* راهنما */

if(q==="/help"){

return `
🤖 راهنمای My AI

🎤 میکروفن
🔊 خواندن جواب
🖼️ ارسال عکس
🧠 حافظه
🧮 ماشین حساب

آموزش:

یاد بگیر: سؤال | جواب

مثال:

یاد بگیر: پایتخت ایران چیست؟ | تهران

دستورها:

/memory
/clear
/help
`;

}


/* حافظه */

if(q==="/memory"){

return(
"🧠 مغز اصلی: "+
Object.keys(brain).length+
" اطلاعات\n"+
"📚 حافظه شخصی: "+
Object.keys(learned).length+
" اطلاعات"
);

}


/* پاک کردن یادگیری */

if(q==="/clear"){

learned={};

localStorage.removeItem("MY_AI_MEMORY");

return "🗑️ حافظه شخصی پاک شد.";

}


/* ماشین حساب */

let math=
calculator(text);

if(math)
return math;


/* جواب */

let result=
findAnswer(text);

if(result)
return result;


/* جواب پیدا نشد */

return(
"🤔 جواب این سؤال را هنوز ندارم.\n\n"+
"می‌توانی به من یاد بدهی:\n"+
"یاد بگیر: "+
text+
" | جواب"
);

}


/* =========================
   📤 ارسال
========================= */

function send(){

let input=
document.getElementById("input");

let text=
input.value.trim();

if(!text)
return;

addMessage(text,"user");

history.push({
text:text,
type:"user"
});

saveChat();

input.value="";

setTimeout(()=>{

let result=
answer(text);

lastAnswer=result;

addMessage(result,"ai");

history.push({
text:result,
type:"ai"
});

saveChat();

},200);

}


/* =========================
   ⌨️ Enter
========================= */

document
.getElementById("input")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter")
send();

});


/* =========================
   🎤 میکروفن
========================= */

function startMic(){

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert(
"❌ مرورگر شما تشخیص صدا را پشتیبانی نمی‌کند."
);

return;

}

const recognition=
new SpeechRecognition();

recognition.lang="fa-IR";

recognition.continuous=false;

recognition.interimResults=false;

recognition.start();

recognition.onresult=function(event){

const text=
event.results[0][0].transcript;

document.getElementById("input").value=text;

};

}


/* =========================
   🔊 صدا
========================= */

function speakLast(){

if(!lastAnswer){

alert("هنوز جوابی ندارم.");

return;

}

speechSynthesis.cancel();

const speech=
new SpeechSynthesisUtterance(
lastAnswer
);

speech.lang="fa-IR";

speech.rate=1;

speechSynthesis.speak(speech);

}


/* =========================
   🧠 حافظه
========================= */

function showMemory(){

addMessage(
"🧠 مغز اصلی: "+
Object.keys(brain).length+
"\n📚 حافظه شخصی: "+
Object.keys(learned).length,
"ai"
);

}


/* =========================
   ❓ راهنما
========================= */

function showHelp(){

addMessage(
answer("/help"),
"ai"
);

}


/* =========================
   🗑️ پاک کردن چت
========================= */

function clearChat(){

if(!confirm("کل چت پاک شود؟"))
return;

history=[];

localStorage.removeItem("MY_AI_CHAT");

document.getElementById("chat").innerHTML="";

addMessage(
"🧹 چت پاک شد.",
"ai"
);

}


/* =========================
   🖼️ عکس
========================= */

function pickImage(){

document
.getElementById("file")
.click();

}


document
.getElementById("file")
.addEventListener(
"change",
function(){

const file=this.files[0];

if(!file)
return;

const reader=
new FileReader();

reader.onload=function(e){

const div=
document.createElement("div");

div.className="msg user";

const img=
document.createElement("img");

img.src=e.target.result;

img.className="image";

div.appendChild(img);

document
.getElementById("chat")
.appendChild(div);

scrollChat();

addMessage(
"🖼️ عکس دریافت شد.",
"ai"
);

};

reader.readAsDataURL(file);

});


/* =========================
   🚀 شروع
========================= */

addMessage(
"🤖 سلام!\nدر حال بارگذاری مغز...",
"ai"
);

loadBrain();

</script>

</body>
</html>
