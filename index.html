<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zivo | زیوو</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://v1.fontapi.ir/css/Vazir');
        body { 
            font-family: 'Vazir', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="pb-20">

    <!-- Header -->
    <header class="sticky top-0 z-40 glass shadow-lg">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
            <!-- Logo -->
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-2xl bg-rose-600 flex items-center justify-center font-black text-xl text-white shadow-lg">Z</div>
                <span class="text-2xl font-bold tracking-wide">Zivo</span>
            </div>

            <!-- Header Actions / Buttons -->
            <div class="flex items-center gap-2">
                <!-- Profile / Auth Button -->
                <button onclick="handleProfileClick()" type="button" class="w-10 h-10 rounded-xl glass hover:bg-white/20 flex items-center justify-center text-blue-400 transition active:scale-90 cursor-pointer" title="ورود / حساب کاربری">
                    <i class="fa-solid fa-user text-lg"></i>
                </button>

                <!-- Favorites Button -->
                <button onclick="handleFavClick()" type="button" class="w-10 h-10 rounded-xl glass hover:bg-white/20 flex items-center justify-center text-rose-500 transition active:scale-90 cursor-pointer" title="علاقه‌مندی‌ها">
                    <i class="fa-solid fa-heart text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Search Section -->
    <div class="max-w-7xl mx-auto px-4 mt-4">
        <div class="relative">
            <input type="text" id="searchInput" placeholder="جستجوی محصول، موبایل، لپ‌تاپ و..." 
                class="w-full pr-10 pl-4 py-3 rounded-2xl glass text-sm focus:outline-none focus:ring-2 focus:ring-rose-500 text-white placeholder-gray-400">
            <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3.5 text-gray-400"></i>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- AI Assistant Box -->
        <div class="glass-card rounded-3xl p-4 mb-6">
            <div class="flex items-center gap-2 mb-3 text-sm font-bold text-rose-400">
                <i class="fa-solid fa-robot"></i>
                <span>سلام! من دستیار هوشمند Zivo هستم. چطور می‌توانم کمکتان کنم؟</span>
            </div>
            <div class="flex gap-2">
                <input type="text" id="chatInput" placeholder="پیام خود را بنویسید..." class="flex-1 px-4 py-2.5 rounded-xl glass text-sm focus:outline-none text-white">
                <button onclick="handleSendMessage()" type="button" class="bg-rose-600 hover:bg-rose-700 text-white px-4 rounded-xl flex items-center justify-center transition active:scale-90 cursor-pointer">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- Section Header -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-store text-rose-500"></i> لیست آگهی‌ها
            </h2>
        </div>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="col-span-full text-center py-12 glass-card rounded-2xl text-gray-400 text-sm">
                هیچ آگهی ثبت نشده است.
            </div>
        </div>
    </main>

    <!-- Inline JavaScript Functions -->
    <script>
        function handleProfileClick() {
            alert("دکمه پروفایل کار می‌کند!");
        }

        function handleFavClick() {
            alert("دکمه علاقه‌مندی‌ها کار می‌کند!");
        }

        function handleSendMessage() {
            const input = document.getElementById('chatInput');
            if (input && input.value.trim() !== "") {
                alert("پیام شما ارسال شد: " + input.value);
                input.value = "";
            } else {
                alert("لطفاً متنی بنویسید.");
            }
        }
    </script>
</body>
</html>
