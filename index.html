<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #0b0d12;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    /* ================= LOGIN ================= */

    #loginPage {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #252b45, #0b0d12 60%);
      padding: 20px;
    }

    .loginBox {
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      border-radius: 25px;
      background: rgba(20, 24, 35, 0.9);
      border: 1px solid #303747;
      text-align: center;
      box-shadow: 0 20px 70px rgba(0,0,0,.45);
    }

    .loginLogo {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 25px;
      margin-bottom: 18px;
    }

    .loginBox h1 {
      margin: 5px 0 10px;
      font-size: 30px;
    }

    .loginBox p {
      color: #aeb6c8;
      margin-bottom: 25px;
    }

    #googleLogin {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      background: white;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #googleLogin:hover {
      opacity: .9;
    }

    #loginError {
      color: #ff7272;
      margin-top: 15px;
      font-size: 14px;
    }

    /* ================= APP ================= */

    #app {
      display: none;
      width: 100%;
      height: 100vh;
    }

    .layout {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      width: 290px;
      height: 100%;
      background: #11151e;
      border-left: 1px solid #282e3a;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px;
      margin-bottom: 15px;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: cover;
    }

    .brand span {
      font-size: 20px;
      font-weight: bold;
    }

    #newChat {
      border: 0;
      border-radius: 13px;
      padding: 13px;
      background: #20283a;
      color: white;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 15px;
    }

    #newChat:hover {
      background: #2b3650;
    }

    .chatList {
      flex: 1;
      overflow-y: auto;
    }

    .chatItem {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px;
      border-radius: 11px;
      margin-bottom: 6px;
      cursor: pointer;
      color: #dbe1ec;
    }

    .chatItem:hover {
      background: #1b2130;
    }

    .chatItem.active {
      background: #252d40;
    }

    .chatTitle {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    .deleteChat {
      border: 0;
      background: transparent;
      color: #8d95a5;
      cursor: pointer;
      font-size: 15px;
    }

    .deleteChat:hover {
      color: #ff6464;
    }

    /* ================= USER ================= */

    .userBox {
      border-top: 1px solid #282e3a;
      padding-top: 13px;
      margin-top: 10px;
    }

    .userInfo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .userInfo img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
    }

    .userText {
      min-width: 0;
      flex: 1;
    }

    .userName {
      font-size: 13px;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .userEmail {
      font-size: 11px;
      color: #8992a4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #logout {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 0;
      border-radius: 10px;
      background: #25191d;
      color: #ff9292;
      cursor: pointer;
    }

    /* ================= CHAT ================= */

    .chatArea {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 65px;
      border-bottom: 1px solid #282e3a;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 10px;
    }

    #mobileMenu {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      font-size: 23px;
      cursor: pointer;
    }

    #currentChatTitle {
      font-size: 16px;
      font-weight: bold;
      flex: 1;
    }

    #themeButton {
      border: 0;
      background: #1b2130;
      color: white;
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .message {
      display: flex;
      margin-bottom: 17px;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(750px, 85%);
      padding: 13px 16px;
      border-radius: 17px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #27334a;
      border-bottom-left-radius: 5px;
    }

    .ai .bubble {
      background: #171d28;
      border: 1px solid #292f3c;
      border-bottom-right-radius: 5px;
    }

    .aiHeader {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 12px;
      color: #9da7ba;
    }

    .aiHeader img {
      width: 25px;
      height: 25px;
      border-radius: 8px;
    }

    /* ================= INPUT ================= */

    .inputArea {
      padding: 15px;
      border-top: 1px solid #282e3a;
    }

    .inputBox {
      max-width: 900px;
      margin: auto;
      display: flex;
      gap: 8px;
      background: #171c26;
      border: 1px solid #303747;
      border-radius: 17px;
      padding: 8px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      resize: none;
      padding: 10px;
      min-height: 45px;
      max-height: 140px;
    }

    #sendButton {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 13px;
      background: #5b6cff;
      color: white;
      cursor: pointer;
      font-size: 20px;
    }

    #sendButton:hover {
      opacity: .9;
    }

    /* ================= LIGHT ================= */

    body.light {
      background: #f3f5f8;
      color: #111;
    }

    body.light .sidebar {
      background: white;
      border-color: #ddd;
    }

    body.light .topbar,
    body.light .inputArea {
      border-color: #ddd;
    }

    body.light .chatItem:hover,
    body.light .chatItem.active {
      background: #edf0f5;
      color: #111;
    }

    body.light .inputBox {
      background: white;
      border-color: #ddd;
    }

    body.light #messageInput {
      color: #111;
    }

    body.light .ai .bubble {
      background: white;
      border-color: #ddd;
    }

    body.light .user .bubble {
      background: #e2e7f5;
      color: #111;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 700px) {

      .sidebar {
        position: fixed;
        z-index: 50;
        right: -310px;
        top: 0;
        transition: right .25s ease;
        box-shadow: -15px 0 40px rgba(0,0,0,.4);
      }

      .sidebar.open {
        right: 0;
      }

      #mobileMenu {
        display: block;
      }

      .messages {
        padding: 15px;
      }

      .bubble {
        max-width: 90%;
      }
    }

    .empty {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #8791a5;
      text-align: center;
    }

    .empty img {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<!-- ================= LOGIN PAGE ================= -->

<section id="loginPage">

  <div class="loginBox">

    <img src="ai.png" class="loginLogo" alt="My AI">

    <h1>My AI</h1>

    <p>
      برای استفاده از My AI وارد حساب Google خود شوید.
    </p>

    <button id="googleLogin">
      🔵 ورود با Google
    </button>

    <div id="loginError"></div>

  </div>

</section>


<!-- ================= APP ================= -->

<section id="app">

  <div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <img src="ai.png" alt="AI">
        <span>My AI</span>
      </div>

      <button id="newChat">
        ＋ چت جدید
      </button>

      <div class="chatList" id="chatList"></div>

      <div class="userBox">

        <div class="userInfo">

          <img id="userPhoto" src="ai.png">

          <div class="userText">
            <div class="userName" id="userName">
              کاربر
            </div>

            <div class="userEmail" id="userEmail">
              -
            </div>
          </div>

        </div>

        <button id="logout">
          خروج از حساب
        </button>

      </div>

    </aside>


    <!-- CHAT AREA -->

    <main class="chatArea">

      <div class="topbar">

        <button id="mobileMenu">
          ☰
        </button>

        <div id="currentChatTitle">
          چت جدید
        </div>

        <button id="themeButton">
          🌙
        </button>

      </div>


      <div class="messages" id="messages">

        <div class="empty">

          <div>

            <img src="ai.png" alt="AI">

            <h2>به My AI خوش آمدی 🤖</h2>

            <p>
              یک پیام بنویس تا گفتگو را شروع کنیم.
            </p>

          </div>

        </div>

      </div>


      <div class="inputArea">

        <div class="inputBox">

          <textarea
            id="messageInput"
            placeholder="پیامت را بنویس..."
            rows="1"></textarea>

          <button id="sendButton">
            ➤
          </button>

        </div>

      </div>

    </main>

  </div>

</section>


<!-- ================= FIREBASE ================= -->

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithRedirect,
    getRedirectResult,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    setDoc,
    getDocs,
    getDoc,
    deleteDoc,
    doc,
    query,
    orderBy,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  import { firebaseConfig }
    from "./firebase-config.js";


  /* ================= FIREBASE ================= */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);

  const googleProvider = new GoogleAuthProvider();


  /* ================= VARIABLES ================= */

  let currentUser = null;

  let currentChatId = null;

  let chats = {};

  let brain = {};

  let currentMessages = [];


  /* ================= ELEMENTS ================= */

  const loginPage =
    document.getElementById("loginPage");

  const appPage =
    document.getElementById("app");

  const googleLogin =
    document.getElementById("googleLogin");

  const loginError =
    document.getElementById("loginError");

  const chatList =
    document.getElementById("chatList");

  const messages =
    document.getElementById("messages");

  const messageInput =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const newChat =
    document.getElementById("newChat");

  const currentChatTitle =
    document.getElementById("currentChatTitle");

  const userName =
    document.getElementById("userName");

  const userEmail =
    document.getElementById("userEmail");

  const userPhoto =
    document.getElementById("userPhoto");

  const logout =
    document.getElementById("logout");

  const themeButton =
    document.getElementById("themeButton");

  const mobileMenu =
    document.getElementById("mobileMenu");

  const sidebar =
    document.getElementById("sidebar");


  /* ================= LOAD BRAIN ================= */

  async function loadBrain() {

    try {

      const response =
        await fetch("data.json");

      brain =
        await response.json();

      console.log(
        "AI brain loaded:",
        Object.keys(brain).length
      );

    } catch (error) {

      console.error(
        "data.json error:",
        error
      );

      brain = {};

    }

  }


  /* ================= GOOGLE LOGIN ================= */

  googleLogin.addEventListener(
    "click",
    async () => {

      loginError.textContent = "";

      try {

        await signInWithRedirect(
          auth,
          googleProvider
        );

      } catch (error) {

        console.error(error);

        loginError.textContent =
          "خطا در ورود با Google: " +
          error.message;

      }

    }
  );


  /* ================= REDIRECT RESULT ================= */

  try {

    await getRedirectResult(auth);

  } catch (error) {

    console.error(
      "Google redirect error:",
      error
    );

    loginError.textContent =
      "ورود Google انجام نشد.";

  }


  /* ================= AUTH STATE ================= */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (user) {

        currentUser = user;

        loginPage.style.display = "none";

        appPage.style.display = "block";

        userName.textContent =
          user.displayName || "کاربر";

        userEmail.textContent =
          user.email || "";

        if (user.photoURL) {

          userPhoto.src =
            user.photoURL;

        }

        await loadBrain();

        await loadChats();

      } else {

        currentUser = null;

        loginPage.style.display = "flex";

        appPage.style.display = "none";

      }

    }
  );


  /* ================= LOAD CHATS ================= */

  async function loadChats() {

    if (!currentUser) return;

    chats = {};

    chatList.innerHTML = "";

    try {

      const chatsRef =
        collection(
          db,
          "users",
          currentUser.uid,
          "chats"
        );

      const q =
        query(
          chatsRef,
          orderBy(
            "updatedAt",
            "desc"
          )
        );

      const snapshot =
        await getDocs(q);

      snapshot.forEach(
        (item) => {

          chats[item.id] = {
            id: item.id,
            ...item.data()
          };

        }
      );

      renderChatList();

      const chatIds =
        Object.keys(chats);

      if (chatIds.length > 0) {

        await openChat(chatIds[0]);

      } else {

        await createChat();

      }

    } catch (error) {

      console.error(
        "Load chats error:",
        error
      );

      alert(
        "چت‌ها بارگذاری نشدند. قوانین Firestore را بررسی کن."
      );

    }

  }


  /* ================= RENDER CHAT LIST ================= */

  function renderChatList() {

    chatList.innerHTML = "";

    const list =
      Object.values(chats);

    list.forEach(
      (chat) => {

        const item =
          document.createElement("div");

        item.className =
          "chatItem" +
          (
            chat.id === currentChatId
              ? " active"
              : ""
          );

        const title =
          document.createElement("div");

        title.className =
          "chatTitle";

        title.textContent =
          chat.title || "چت جدید";


        const del =
          document.createElement("button");

        del.className =
          "deleteChat";

        del.textContent =
          "🗑";

        del.onclick =
          async (event) => {

            event.stopPropagation();

            await deleteChat(chat.id);

          };


        item.appendChild(title);

        item.appendChild(del);

        item.onclick =
          () => openChat(chat.id);

        chatList.appendChild(item);

      }
    );

  }


  /* ================= CREATE CHAT ================= */

  async function createChat() {

    if (!currentUser) return;

    try {

      const chatsRef =
        collection(
          db,
          "users",
          currentUser.uid,
          "chats"
        );

      const newChatRef =
        await addDoc(
          chatsRef,
          {
            title: "چت جدید",
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          }
        );

      chats[newChatRef.id] = {

        id: newChatRef.id,

        title: "چت جدید"

      };

      currentChatId =
        newChatRef.id;

      currentMessages = [];

      renderChatList();

      renderMessages();

      currentChatTitle.textContent =
        "چت جدید";

    } catch (error) {

      console.error(error);

      alert(
        "ساخت چت انجام نشد."
      );

    }

  }


  /* ================= OPEN CHAT ================= */

  async function openChat(chatId) {

    if (!currentUser) return;

    currentChatId =
      chatId;

    const chat =
      chats[chatId];

    currentChatTitle.textContent =
      chat?.title || "چت جدید";

    renderChatList();

    currentMessages = [];

    try {

      const messagesRef =
        collection(
          db,
          "users",
          currentUser.uid,
          "chats",
          chatId,
          "messages"
        );

      const q =
        query(
          messagesRef,
          orderBy(
            "createdAt",
            "asc"
          )
        );

      const snapshot =
        await getDocs(q);

      snapshot.forEach(
        (item) => {

          currentMessages.push({
            id: item.id,
            ...item.data()
          });

        }
      );

      renderMessages();

    } catch (error) {

      console.error(error);

      alert(
        "پیام‌های این چت خوانده نشدند."
      );

    }

    sidebar.classList.remove("open");

  }


  /* ================= DELETE CHAT ================= */

  async function deleteChat(chatId) {

    if (!currentUser) return;

    const ok =
      confirm(
        "این چت حذف شود؟"
      );

    if (!ok) return;

    try {

      const messagesRef =
        collection(
          db,
          "users",
          currentUser.uid,
          "chats",
          chatId,
          "messages"
        );

      const snapshot =
        await getDocs(messagesRef);

      for (
        const item of snapshot.docs
      ) {

        await deleteDoc(item.ref);

      }

      await deleteDoc(
        doc(
          db,
          "users",
          currentUser.uid,
          "chats",
          chatId
        )
      );

      delete chats[chatId];

      currentChatId = null;

      currentMessages = [];

      renderChatList();

      const remaining =
        Object.keys(chats);

      if (remaining.length > 0) {

        await openChat(
          remaining[0]
        );

      } else {

        await createChat();

      }

    } catch (error) {

      console.error(error);

      alert(
        "حذف چت انجام نشد."
      );

    }

  }


  /* ================= SAVE MESSAGE ================= */

  async function saveMessage(
    role,
    text
  ) {

    if (
      !currentUser ||
      !currentChatId
    ) return;

    try {

      const messagesRef =
        colle
