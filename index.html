<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100dvh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      border-bottom: 1px solid #292929;
      color: #ff3030;
      font-size: 23px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 17px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      align-self: flex-start;
      background: #252525;
    }

    .ai {
      align-self: flex-end;
      background: #3b1010;
      border: 1px solid #8d2222;
    }

    .welcome {
      align-self: center;
      margin-top: 20px;
      color: #aaa;
      text-align: center;
    }

    form {
      display: flex;
      gap: 9px;
      padding: 12px;
      background: #111;
      border-top: 1px solid #292929;
    }

    #message {
      flex: 1;
      min-width: 0;
      height: 50px;
      padding: 0 15px;
      border: 1px solid #444;
      border-radius: 14px;
      background: #202020;
      color: white;
      font-size: 16px;
      outline: none;
    }

    #message:focus {
      border-color: #e32636;
    }

    #send {
      width: 75px;
      border: 0;
      border-radius: 14px;
      background: #e32636;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #send:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <header>
    🔴 My AI
  </header>

  <main id="chat">
    <div class="welcome">
      به My AI خوش آمدی 👋
    </div>
  </main>

  <form id="chatForm">
    <input
      id="message"
      type="text"
      placeholder="پیامت را بنویس..."
      autocomplete="off"
    >

    <button id="send" type="submit">
      ارسال
    </button>
  </form>

  <script>
    const WORKER_URL =
      "https://old-fire-5f7e.ydanyani95.workers.dev/";

    const chat = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const text = input.value.trim();

      if (!text) {
        return;
      }

      addMessage(text, "user");

      input.value = "";
      send.disabled = true;

      const aiMessage = addMessage(
        "⏳ در حال فکر کردن...",
        "ai"
      );

      try {

        const response = await fetch(WORKER_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error?.message ||
            data.error ||
            "خطای سرور"
          );
        }

        aiMessage.textContent =
          data.reply || "پاسخی دریافت نشد.";

      } catch (error) {

        aiMessage.textContent =
          "❌ خطا در اتصال به AI\n\n" +
          error.message;

      } finally {

        send.disabled = false;
        input.focus();

      }
    });
  </script>

</body>
</html>
