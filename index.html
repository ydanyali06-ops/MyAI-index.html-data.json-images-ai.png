<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>

<style>
body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

h1 {
  text-align: center;
  color: red;
}

#chat {
  height: 75vh;
  overflow-y: auto;
  padding: 15px;
}

.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
}

.user {
  background: #350000;
}

.ai {
  background: #181818;
}

#box {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 10px;
  background: #090909;
  display: flex;
  gap: 8px;
}

#input {
  flex: 1;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #555;
  background: #111;
  color: white;
}

button {
  padding: 10px 18px;
  border: 0;
  border-radius: 10px;
  background: red;
  color: white;
}
</style>
</head>

<body>

<h1>My AI 🤖</h1>

<div id="chat"></div>

<div id="box">
  <input id="input" placeholder="پیامت را بنویس...">
  <button id="send">ارسال</button>
</div>

<script>
const WORKER_URL =
"https://old-fire-5f7e.ydanyali95.workers.dev/";

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

async function sendMessage() {

  const message = input.value.trim();

  if (!message) return;

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = message;
  chat.appendChild(userMessage);

  input.value = "";

  const aiMessage = document.createElement("div");
  aiMessage.className = "message ai";
  aiMessage.textContent = "در حال فکر کردن...";
  chat.appendChild(aiMessage);

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    aiMessage.textContent =
      data.reply ||
      data.error ||
      "پاسخی دریافت نشد.";

  } catch (error) {

    aiMessage.textContent =
      "Failed to fetch ❌";

  }

  chat.scrollTop = chat.scrollHeight;
}

send.onclick = sendMessage;

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
