<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 18px;
  font-size: 25px;
  font-weight: bold;
  color: red;
  border-bottom: 1px solid #330000;
}

#chat {
  height: calc(100vh - 140px);
  overflow-y: auto;
  padding: 15px;
}

.message {
  max-width: 85%;
  padding: 12px 15px;
  margin: 10px 0;
  border-radius: 15px;
  white-space: pre-wrap;
}

.user {
  margin-right: auto;
  background: #350000;
}

.ai {
  margin-left: auto;
  background: #181818;
}

#inputBox {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  gap: 8px;
  padding: 10px;
  background: #090909;
  border-top: 1px solid #333;
}

#message {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #555;
  background: #111;
  color: white;
  font-size: 16px;
  outline: none;
}

#send {
  padding: 0 18px;
  border: none;
  border-radius: 12px;
  background: red;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>My AI 🤖</header>

<div id="chat"></div>

<div id="inputBox">
  <input
    id="message"
    type="text"
    placeholder="پیامت را بنویس..."
    autocomplete="off"
  >

  <button id="send">ارسال</button>
</div>

<script>

const WORKER_URL =https://old-fire-5f7e.ydanyani95.workers.dev/
const input = document.getElementById("message");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "message " + type;

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;

  return div;
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  const aiMessage =
    addMessage("در حال ارسال...", "ai");

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message ||
        data.error ||
        "خطای سرور"
      );
    }

    aiMessage.textContent =
      data.reply || "پاسخی دریافت نشد.";

  } catch (error) {

    aiMessage.textContent =
      "خطا: " + error.message;

    console.error(error);
  }
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    sendMessage();
  }

});

</script>

</body>
</html>
