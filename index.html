
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      padding: 18px;
      background: #111;
      border-bottom: 1px solid #292929;
      color: #ff3030;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }
    .user {
      align-self: flex-start;
      background: #292929;
    }
    .ai {
      align-self: flex-end;
      background: #401313;
      border: 1px solid #8b2020;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #111;
      border-top: 1px solid #292929;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #202020;
      color: white;
      font-size: 16px;
      outline: none;
    }
    button {
      background: #e32636;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <header>🔴 My AI</header>
  <main id="chat">
    <div class="msg ai">سلام! من My AI هستم. چی می‌خوای بپرسی؟</div>
  </main>

  <form id="form">
    <input id="message" placeholder="پیامت رو بنویس..." autocomplete="off" required>
    <button id="send" type="submit">ارسال</button>
  </form>

  <script>
    const WORKER_URL = "https://old-fire-5f7e.ydanyani95.workers.dev/";

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;

      const waiting = addMessage("در حال فکر کردن...", "ai");

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || data.error || "خطای سرور");
        }

        waiting.textContent = data.reply || "پاسخی دریافت نشد.";
      } catch (error) {
        waiting.textContent =
          "اتصال ناموفق بود: " + error.message +
          "\nلطفاً تنظیمات Worker و CORS را بررسی کن.";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
