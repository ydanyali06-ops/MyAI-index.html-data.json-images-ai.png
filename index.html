<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: white;
      min-height: 100vh;
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #181b22;
      border: 1px solid #292d36;
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 22px;
      object-fit: cover;
      margin-bottom: 20px;
    }

    h1 {
      margin: 5px 0 10px;
      font-size: 30px;
    }

    p {
      color: #aeb4c0;
      line-height: 1.7;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    #googleLogin {
      background: white;
      color: #111;
    }

    #logout {
      background: #292d36;
      color: white;
    }

    #app {
      display: none;
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 25px;
    }

    .user {
      background: #181b22;
      border: 1px solid #292d36;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .user img {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      vertical-align: middle;
      margin-left: 10px;
    }

    .welcome {
      background: #181b22;
      border-radius: 18px;
      padding: 25px;
    }
  </style>
</head>

<body>

  <!-- صفحه ورود -->
  <div class="container" id="loginPage">
    <div class="card">

      <img
        src="ai.png"
        class="logo"
        onerror="this.style.display='none'"
      >

      <h1>My AI</h1>

      <p>
        به هوش مصنوعی شخصی خودت خوش آمدی 🤖
      </p>

      <button id="googleLogin">
        ورود با حساب Google
      </button>

    </div>
  </div>


  <!-- برنامه بعد از ورود -->
  <div id="app">

    <div class="user">
      <img id="userPhoto" src="" alt="">
      <strong id="userName"></strong>
      <p id="userEmail"></p>

      <button id="logout">
        خروج از حساب
      </button>
    </div>

    <div class="welcome">
      <h2>سلام 👋</h2>
      <p>
        ورود با موفقیت انجام شد.
      </p>

      <p>
        🚧 بخش چت در مرحله بعد ساخته می‌شود.
      </p>
    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import { firebaseConfig }
      from "./firebase-config.js";


    // اتصال Firebase
    const app = initializeApp(firebaseConfig);

    // اتصال Authentication
    const auth = getAuth(app);

    // Google
    const provider = new GoogleAuthProvider();


    const loginPage = document.getElementById("loginPage");
    const appPage = document.getElementById("app");

    const googleLogin = document.getElementById("googleLogin");
    const logout = document.getElementById("logout");

    const userName = document.getElementById("userName");
    const userEmail = document.getElementById("userEmail");
    const userPhoto = document.getElementById("userPhoto");


    // ورود با Google
    googleLogin.addEventListener("click", async () => {

      try {

        await signInWithPopup(auth, provider);

      } catch (error) {

        console.error(error);

        alert(
          "ورود انجام نشد:\n" +
          error.message
        );

      }

    });


    // بررسی وضعیت ورود
    onAuthStateChanged(auth, (user) => {

      if (user) {

        loginPage.style.display = "none";
        appPage.style.display = "block";

        userName.textContent =
          user.displayName || "کاربر";

        userEmail.textContent =
          user.email || "";

        if (user.photoURL) {
          userPhoto.src = user.photoURL;
        }

      } else {

        loginPage.style.display = "flex";
        appPage.style.display = "none";

      }

    });


    // خروج
    logout.addEventListener("click", async () => {

      await signOut(auth);

    });

  </script>

</body>
</html>
