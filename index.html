<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101216;
      color: white;
    }

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 90%;
      max-width: 400px;
      padding: 30px;
      background: #1b1e25;
      border-radius: 20px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    #googleLogin {
      background: white;
      color: black;
    }

    #app {
      display: none;
      padding: 30px;
      text-align: center;
    }

    #userPhoto {
      width: 80px;
      height: 80px;
      border-radius: 50%;
    }

    #logout {
      background: #292d35;
      color: white;
    }
  </style>
</head>

<body>

  <!-- ورود -->
  <div id="loginPage">
    <div class="card">

      <h1>🤖 My AI</h1>

      <p>برای ورود به My AI با حساب Google وارد شوید.</p>

      <button id="googleLogin">
        ورود با Google
      </button>

    </div>
  </div>


  <!-- برنامه -->
  <div id="app">

    <img id="userPhoto" src="" alt="">

    <h1 id="userName"></h1>

    <p id="userEmail"></p>

    <h2>🎉 ورود موفق بود!</h2>

    <button id="logout">
      خروج
    </button>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithRedirect,
      getRedirectResult,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import { firebaseConfig }
      from "./firebase-config.js";


    // Firebase
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();


    const loginPage =
      document.getElementById("loginPage");

    const appPage =
      document.getElementById("app");

    const googleLogin =
      document.getElementById("googleLogin");

    const logout =
      document.getElementById("logout");

    const userName =
      document.getElementById("userName");

    const userEmail =
      document.getElementById("userEmail");

    const userPhoto =
      document.getElementById("userPhoto");


    // ورود Google
    googleLogin.addEventListener("click", async () => {

      try {

        await signInWithRedirect(auth, provider);

      } catch (error) {

        console.error(error);

        alert(error.message);

      }

    });


    // نتیجه برگشت از Google
    getRedirectResult(auth)
      .then((result) => {

        if (result && result.user) {

          console.log(
            "ورود موفق:",
            result.user.email
          );

        }

      })
      .catch((error) => {

        console.error(
          "خطای ورود:",
          error
        );

        alert(error.message);

      });


    // وضعیت حساب
    onAuthStateChanged(auth, (user) => {

      if (user) {

        // مخفی کردن ورود
        loginPage.style.display = "none";

        // نمایش برنامه
        appPage.style.display = "block";


        userName.textContent =
          user.displayName || "کاربر";

        userEmail.textContent =
          user.email || "";


        if (user.photoURL) {

          userPhoto.src =
            user.photoURL;

        }

      } else {

        loginPage.style.display = "flex";

        appPage.style.display = "none";

      }

    });


    // خروج
    logout.addEventListener("click", async () => {

      await signOut(auth);

    });

  </script>

</body>
</html>
