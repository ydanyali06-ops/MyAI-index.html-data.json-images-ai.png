<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100dvh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      border-bottom: 1px solid #333;
      color: #ff2020;
      font-size: 24px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user {
      margin-left: auto;
      background: #292929;
    }

    .ai {
      margin-right: auto;
      background: #3d1010;
      border: 1px solid #8d2020;
    }

    #form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #111;
      border-top: 1px solid #333;
    }

    #message {
      flex: 1;
      min-width: 0;
      height: 50px;
      padding: 0 15px;
      border-radius: 14px;
      border: 1px solid #444;
      background: #202020;
      color: white;
      font-size: 16px;
      outline: none;
    }

    #send {
      width: 75px;
      border: 0;
      border-radius: 14px;
      background: #e32636;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    #send:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<header>🔴 My AI</header>

<div id="chat">
  <div class="message ai">سلام! من My AI هستم 👋</div>
</div>

<form id="form">

  <input
    id="message"
    type="text"
    placeholder="پیامت را بنویس..."
    autocomplete="off"
    required
  >

  <button id="send" type="submit">ارسال</button>

</form>

<script>

const WORKER_URL =
"https://old-fire-5f7e.ydanyani95.workers.dev/";

const form = document.getElementById("form");
const input = document.getElementById("message");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  return div;
}

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";
  send.disabled = true;

  const answer = addMessage(
    "⏳ در حال فکر کردن...",
    "ai"
  );

  try {

    const response = await fetch(WORKER_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message ||
        data.error ||
        "خطای سرور"
      );
    }

    answer.textContent =
      data.reply || "پاسخی دریافت نشد.";

  } catch (error) {

    answer.textContent =
      "❌ خطا:\n" + error.message;

  } finally {

    send.disabled = false;
    input.focus();

  }

});

</script>

</body>
</html>
