<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زیوو | تعویض تصویر با کلیک دکمه</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://v1.fontapi.ir/css/Vazir');
        body {
            font-family: 'Vazir', sans-serif;
            background-color: #080c14;
            color: #f1f5f9;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .active-thumb {
            border-color: #f43f5e !important;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="p-4 sm:p-8 min-h-screen flex items-center justify-center">

    <div class="max-w-4xl w-full space-y-8">
        
        <!-- هدر -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl sm:text-3xl font-black bg-gradient-to-r from-rose-500 to-amber-500 bg-clip-text text-transparent">
                نمایش تغییر تصویر با کلیک دکمه‌ها
            </h1>
            <p class="text-xs text-gray-400">روی دکمه‌ها یا تصاویر کوچک کلیک کنید تا تصویر اصلی تغییر کند.</p>
        </div>

        <!-- ================= بخش ۱: گالری محصول (تغییر عکس اصلی با کلیک روی دکمه/عکس کوچک) ================= -->
        <div class="glass-card p-6 rounded-3xl shadow-2xl grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
            
            <!-- تصویر اصلی (که با دکمه تغییر می‌کند) -->
            <div class="relative w-full h-72 rounded-2xl overflow-hidden bg-slate-800 border border-white/10 shadow-lg">
                <img id="mainProductImage" 
                     src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&w=800&q=80" 
                     alt="تصویر اصلی" 
                     class="w-full h-full object-cover transition-all duration-500">
                <span id="imageTag" class="absolute top-3 right-3 bg-rose-600 text-white text-[10px] font-bold px-3 py-1 rounded-xl shadow-md">
                    نمای روبرو
                </span>
            </div>

            <!-- دکمه‌ها و گزینه‌های تغییر عکس -->
            <div class="space-y-4">
                <h2 class="text-lg font-bold text-rose-400">انتخاب زوایای محصول:</h2>
                
                <!-- روش اول: دکمه‌های متنی/آیکون دار -->
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="changeImage('https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&w=800&q=80', 'نمای روبرو', this)" 
                            class="thumb-btn active-thumb p-3 rounded-2xl glass-card text-xs font-bold hover:bg-rose-500/20 border-2 border-transparent transition text-center">
                        <i class="fa-solid fa-mobile-screen block text-base mb-1 text-rose-500"></i>
                        نمای روبرو
                    </button>

                    <button onclick="changeImage('https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80', 'نمای پشت', this)" 
                            class="thumb-btn p-3 rounded-2xl glass-card text-xs font-bold hover:bg-rose-500/20 border-2 border-transparent transition text-center">
                        <i class="fa-solid fa-camera block text-base mb-1 text-rose-500"></i>
                        نمای پشت
                    </button>

                    <button onclick="changeImage('https://images.unsplash.com/photo-1592750475338-74b7b21085ab?auto=format&fit=crop&w=800&q=80', 'نمای جانبی', this)" 
                            class="thumb-btn p-3 rounded-2xl glass-card text-xs font-bold hover:bg-rose-500/20 border-2 border-transparent transition text-center">
                        <i class="fa-solid fa-layer-group block text-base mb-1 text-rose-500"></i>
                        نمای جانبی
                    </button>
                </div>

                <!-- روش دوم: کلیک روی پیش‌نمایش‌های مصور -->
                <p class="text-xs text-gray-400 pt-2">یا روی تصاویر زیر کلیک کنید:</p>
                <div class="flex gap-3">
                    <img onclick="changeImage('https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&w=800&q=80', 'نمای روبرو')" 
                         src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&w=200&q=80" 
                         class="w-16 h-16 rounded-xl object-cover cursor-pointer hover:opacity-80 transition border-2 border-white/10">
                    
                    <img onclick="changeImage('https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80', 'نمای پشت')" 
                         src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=200&q=80" 
                         class="w-16 h-16 rounded-xl object-cover cursor-pointer hover:opacity-80 transition border-2 border-white/10">
                    
                    <img onclick="changeImage('https://images.unsplash.com/photo-1592750475338-74b7b21085ab?auto=format&fit=crop&w=800&q=80', 'نمای جانبی')" 
                         src="https://images.unsplash.com/photo-1592750475338-74b7b21085ab?auto=format&fit=crop&w=200&q=80" 
                         class="w-16 h-16 rounded-xl object-cover cursor-pointer hover:opacity-80 transition border-2 border-white/10">
                </div>
            </div>
        </div>

        <!-- ================= بخش ۲: آپلود و تغییر تصویر شخصی توسط کاربر ================= -->
        <div class="glass-card p-6 rounded-3xl shadow-2xl">
            <h2 class="text-lg font-bold text-rose-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i> آپلود و جایگزینی تصویر جدید
            </h2>
            
            <div class="flex flex-col sm:flex-row items-center gap-4">
                <input type="file" id="userCustomImage" accept="image/*" class="hidden">
                <button onclick="document.getElementById('userCustomImage').click()" 
                        class="w-full sm:w-auto px-6 py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 font-bold text-xs shadow-lg shadow-rose-500/20 active:scale-95 transition">
                    انتخاب عکس جدید از سیستم
                </button>
                <span class="text-xs text-gray-400">عکس انتخابی شما بلافاصله جایگزین عکس اصلی بالا خواهد شد.</span>
            </div>
        </div>

    </div>

    <!-- اسکریپت جاوااسکریپت برای تعویض عکس -->
    <script>
        // فانکشن اصلی تغییر عکس
        function changeImage(newSrc, tagText, element) {
            const mainImg = document.getElementById('mainProductImage');
            const imageTag = document.getElementById('imageTag');

            // افکت محو شدن هنگام تغییر
            mainImg.style.opacity = '0.3';

            setTimeout(() => {
                mainImg.src = newSrc;
                if(imageTag) imageTag.innerText = tagText;
                mainImg.style.opacity = '1';
            }, 200);

            // مدیریت استایل دکمه فعال
            if (element) {
                document.querySelectorAll('.thumb-btn').forEach(btn => {
                    btn.classList.remove('active-thumb');
                });
                element.classList.add('active-thumb');
            }
        }

        // تغییر تصویر با آپلود فایل جدید توسط کاربر
        document.getElementById('userCustomImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    changeImage(event.target.result, 'تصویر آپلود شده');
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
