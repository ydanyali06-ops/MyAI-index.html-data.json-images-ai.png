<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ff0000;
  font-size:25px;
  font-weight:bold;
  border-bottom:1px solid #333;
}

#chat{
  height:calc(100vh - 140px);
  overflow-y:auto;
  padding:15px;
  padding-bottom:25px;
}

.message{
  max-width:85%;
  padding:12px 15px;
  margin:10px 0;
  border-radius:16px;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.7;
}

.user{
  background:#350000;
  margin-right:auto;
}

.ai{
  background:#181818;
  margin-left:auto;
}

#box{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:75px;
  padding:10px;
  display:flex;
  gap:8px;
  background:#090909;
  border-top:1px solid #333;
}

#input{
  flex:1;
  min-width:0;
  padding:13px;
  border-radius:13px;
  border:1px solid #555;
  outline:none;
  background:#111;
  color:#fff;
  font-size:16px;
}

#send{
  width:75px;
  border:0;
  border-radius:13px;
  background:#e00000;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

#send:disabled{
  opacity:.5;
}
</style>
</head>

<body>

<header>My AI 🤖</header>

<div id="chat"></div>

<div id="box">
  <input
    id="input"
    type="text"
    placeholder="پیامت را بنویس..."
    autocomplete="off"
  >

  <button id="send">ارسال</button>
</div>

<script>

const WORKER_URL =
"https://broad-resonance-8060.ydanyali95.workers.dev/";

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");

function addMessage(text,type){

  const message = document.createElement("div");

  message.className = "message " + type;
  message.textContent = text;

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;

  return message;
}

async function sendMessage(){

  const message = input.value.trim();

  if(!message) return;

  addMessage(message,"user");

  input.value = "";
  send.disabled = true;

  const aiMessage =
    addMessage("در حال فکر کردن... 🤖","ai");

  try{

    const response = await fetch(WORKER_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:message
      })
    });

    const data = await response.json();

    if(data.reply){

      aiMessage.textContent = data.reply;

    }else if(data.error){

      aiMessage.textContent =
        "خطا: " +
        (typeof data.error === "string"
          ? data.error
          : JSON.stringify(data.error));

    }else{

      aiMessage.textContent =
        "پاسخی از AI دریافت نشد.";

    }

  }catch(error){

    aiMessage.textContent =
      "خطا در اتصال ❌\n" + error.message;

  }finally{

    send.disabled = false;
    input.focus();

  }
}

send.addEventListener("click",sendMessage);

input.addEventListener("keydown",(event)=>{

  if(event.key === "Enter"){
    sendMessage();
  }

});

</script>

</body>
</html>
