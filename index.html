<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زیوو | پلتفرم واقعی با سیستم ورود و ثبت آگهی</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://v1.fontapi.ir/css/Vazir');
        
        * {
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
        }

        body { 
            font-family: 'Vazir', sans-serif;
            min-height: 100vh;
        }

        /* استایل حالت تاریک و روشن با افکت بلور شیشه‌ای */
        .dark body {
            background-color: #080c14;
            color: #f1f5f9;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* هدر شیشه‌ای بلور */
        .glass-nav {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dark .glass-nav {
            background: rgba(15, 23, 42, 0.75);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        /* کارت‌های شیشه‌ای بلور */
        .glass-card {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        /* دکمه دسته‌بندی فعال */
        .active-cat {
            background: linear-gradient(135deg, #f43f5e, #e11d48) !important;
            color: #ffffff !important;
            box-shadow: 0 8px 20px -4px rgba(244, 63, 94, 0.5);
        }

        /* مدیریت نمایش صفحات */
        .page-view {
            display: none;
        }
        .page-view.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="pb-24">

    <!-- هدر شیشه‌ای -->
    <header class="sticky top-0 z-40 glass-nav shadow-lg">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
            
            <!-- لوگو -->
            <div onclick="navigateTo('homePage')" class="flex items-center gap-3 cursor-pointer">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-rose-500 via-pink-500 to-amber-500 flex items-center justify-center font-black text-xl text-white shadow-md shadow-rose-500/30">Z</div>
                <span class="text-2xl font-black bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 bg-clip-text text-transparent">Zivo</span>
            </div>

            <!-- دکمه‌های هدر -->
            <div class="flex items-center gap-2">
                <!-- دکمه ورود / پروفایل -->
                <button id="authBtn" onclick="handleAuthClick()" class="px-4 py-2 rounded-2xl glass-card text-xs font-bold flex items-center gap-2 hover:border-rose-500 transition">
                    <i class="fa-solid fa-user text-rose-500"></i>
                    <span id="authBtnText">ورود / ثبت‌نام</span>
                </button>

                <!-- دکمه تغییر تم (شب / روز) -->
                <button id="themeToggleBtn" type="button" class="w-10 h-10 rounded-2xl glass-card flex items-center justify-center text-amber-400 hover:scale-105 active:scale-95 transition" title="تغییر تم">
                    <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
                </button>

                <!-- دکمه ثبت آگهی -->
                <button onclick="navigateTo('addAdPage')" class="px-4 py-2.5 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold text-xs flex items-center gap-2 shadow-lg shadow-rose-500/25 transition active:scale-95">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>ثبت آگهی</span>
                </button>
            </div>

        </div>
    </header>

    <!-- ================= 1. صفحه اصلی (نمایش دسته‌بندی‌ها و کارت‌ها) ================= -->
    <main id="homePage" class="page-view active max-w-7xl mx-auto px-4 pt-6 space-y-8">
        
        <!-- جستجو -->
        <div class="relative">
            <input type="text" id="searchInput" oninput="filterProducts()" placeholder="جستجوی عنوان آگهی، آیفون، پورشه، ساعت..." 
                class="w-full pr-12 pl-4 py-4 rounded-3xl glass-card text-sm focus:outline-none focus:ring-2 focus:ring-rose-500 shadow-inner">
            <i class="fa-solid fa-magnifying-glass absolute right-4 top-4 text-gray-400 text-xl"></i>
        </div>

        <!-- دکمه‌های تغییر دسته‌بندی (تغییر عکس‌ها و متن‌های صفحه) -->
        <div>
            <h2 class="text-xs font-bold text-gray-400 mb-3 px-1">انتخاب دسته‌بندی محصولات:</h2>
            <div class="flex flex-wrap gap-2.5">
                <button onclick="switchCategory('all', this)" class="cat-btn active-cat px-5 py-3 rounded-2xl glass-card text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-border-all"></i> همه آگهی‌ها
                </button>
                <button onclick="switchCategory('digital', this)" class="cat-btn px-5 py-3 rounded-2xl glass-card text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-mobile-screen"></i> کالای دیجیتال
                </button>
                <button onclick="switchCategory('cars', this)" class="cat-btn px-5 py-3 rounded-2xl glass-card text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-car"></i> خودروهای لوکس
                </button>
                <button onclick="switchCategory('watches', this)" class="cat-btn px-5 py-3 rounded-2xl glass-card text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-clock"></i> ساعت‌های خاص
                </button>
            </div>
        </div>

        <!-- عنوان بخش -->
        <div class="flex justify-between items-center border-b border-gray-500/20 pb-4">
            <h2 id="categoryTitle" class="text-lg font-black text-rose-500 flex items-center gap-2">
                <i class="fa-solid fa-fire"></i> همه آگهی‌ها
            </h2>
            <span id="itemCount" class="text-xs text-gray-400">تعداد آگهی: ۰</span>
        </div>

        <!-- گرید کارت‌های آگهی -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- کارت‌ها به‌صورت دینامیک از جاوااسکریپت بارگذاری می‌شوند -->
        </div>

    </main>

    <!-- ================= 2. صفحه ورود و انتخاب رمز عبور (Login / Password) ================= -->
    <div id="loginPage" class="page-view max-w-md mx-auto px-4 pt-10">
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
            
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-rose-500/20 text-rose-500 rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto mb-3">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-xl font-black">ورود به حساب کاربری</h2>
                <p class="text-xs text-gray-400">برای ثبت آگهی و مدیریت حساب، وارد شوید</p>
            </div>

            <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold mb-2 text-gray-400">نام کاربری یا ایمیل</label>
                    <input type="text" id="loginUser" placeholder="مثال: 010604=8" required class="w-full px-4 py-3.5 rounded-2xl glass-card text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>

                <div>
                    <label class="block text-xs font-bold mb-2 text-gray-400">رمز عبور (Password)</label>
                    <div class="relative">
                        <input type="password" id="loginPassword" placeholder="••••••••" required class="w-full px-4 py-3.5 pl-12 rounded-2xl glass-card text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                        <button type="button" onclick="togglePasswordVisibility('loginPassword', 'eyeIcon')" class="absolute left-4 top-3.5 text-gray-400 hover:text-rose-500">
                            <i id="eyeIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs text-gray-400 pt-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="accent-rose-500 rounded">
                        <span>مرا به خاطر بسپار</span>
                    </label>
                    <a href="#" onclick="alert('لینک بازیابی رمز عبور به ایمیل شما ارسال شد.')" class="hover:text-rose-500">رمز عبور را فراموش کرده‌اید؟</a>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-rose-500 via-pink-600 to-amber-500 hover:opacity-95 text-white py-4 rounded-2xl font-black text-sm shadow-xl shadow-rose-500/25 transition active:scale-95">
                    ورود به حساب
                </button>
            </form>

            <div class="text-center text-xs text-gray-400 pt-2">
                حساب کاربری ندارید؟ <button onclick="navigateTo('homePage')" class="text-rose-500 font-bold">بازگشت به صفحه اصلی</button>
            </div>

        </div>
    </div>

    <!-- ================= 3. صفحه ثبت آگهی واقعی ================= -->
    <div id="addAdPage" class="page-view max-w-2xl mx-auto px-4 pt-6">
        <div class="glass-card rounded-3xl p-6 sm:p-8 relative shadow-2xl space-y-6">
            
            <div class="flex items-center justify-between border-b border-gray-500/20 pb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-rose-500/20 text-rose-500 rounded-2xl flex items-center justify-center font-bold text-xl">
                        <i class="fa-solid fa-plus-circle"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-black">ثبت آگهی واقعی جدید</h2>
                        <p class="text-xs text-gray-400">اطلاعات و عکس آگهی را وارد کنید</p>
                    </div>
                </div>
                <button onclick="navigateTo('homePage')" class="text-gray-400 hover:text-rose-500 p-2">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="addAdForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold mb-2 text-gray-400">عنوان آگهی</label>
                    <input type="text" id="adTitle" placeholder="مثال: آیفون ۱۵ پرو مکس ۲۵۶ گیگ" required class="w-full px-4 py-3.5 rounded-2xl glass-card text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold mb-2 text-gray-400">قیمت (تومان)</label>
                        <input type="text" id="adPrice" placeholder="مثال: ۶۵,۰۰۰,۰۰۰" required class="w-full px-4 py-3.5 rounded-2xl glass-card text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-2 text-gray-400">انتخاب دسته‌بندی</label>
                        <select id="adCategory" class="w-full px-4 py-3.5 rounded-2xl glass-card text-sm focus:outline-none focus:ring-2 focus:ring-rose-500 dark:bg-slate-900 bg-white">
                            <option value="digital">کالای دیجیتال</option>
                            <option value="cars">خودروهای لوکس</option>
                            <option value="watches">ساعت‌های خاص</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-2 text-gray-400">تصویر کالا</label>
                    <input type="file" id="adImageInput" accept="image/*" required class="w-full text-xs text-gray-400 file:mr-4 file:py-3 file:px-5 file:rounded-2xl file:border-0 file:text-xs file:font-bold file:bg-rose-500 file:text-white hover:file:bg-rose-600 cursor-pointer">
                    <div id="imagePreview" class="mt-3 hidden w-full h-48 rounded-2xl overflow-hidden glass-card">
                        <img id="previewImg" src="" class="w-full h-full object-cover">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-2 text-gray-400">توضیحات آگهی</label>
                    <textarea id="adDesc" rows="3" placeholder="توضیحات کامل سلامت و مشخصات کالا..." class="w-full px-4 py-3.5 rounded-2xl glass-card text-sm focus:outline-none focus:ring-2 focus:ring-rose-500"></textarea>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-rose-500 via-pink-600 to-amber-500 hover:opacity-95 text-white py-4 rounded-2xl font-black text-sm shadow-xl shadow-rose-500/25 transition active:scale-95">
                    انتشار فوری آگهی در سایت
                </button>
            </form>

        </div>
    </div>

    <!-- ================= اسکریپت‌های مدیریت سایت ================= -->
    <script>
        // ۱. دیتابیس آگهی‌ها
        let database = {
            digital: [
                { id: '1', title: 'آیفون ۱۵ پرو مکس', price: '۶۵,۰۰۰,۰۰۰ تومان', desc: '۲۵۶ گیگ - پارت LLA - سلامت باتری ۱۰۰٪', cat: 'digital', img: 'https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&w=800&q=80' },
                { id: '2', title: 'مک‌بوک ایر M2', price: '۵۸,۰۰۰,۰۰۰ تومان', desc: 'رم ۱۶ گیگ - SSD ۵۱۲ - مشکی', cat: 'digital', img: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=800&q=80' }
            ],
            cars: [
                { id: '3', title: 'پورشه پانامرا توربو', price: '۱۲,۵۰۰,۰۰۰,۰۰۰ تومان', desc: 'مدل ۲۰۲۲ - بدون رنگ - فول کامل', cat: 'cars', img: 'https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?auto=format&fit=crop&w=800&q=80' },
                { id: '4', title: 'مرسدس بنز S500', price: '۱۵,۰۰۰,۰۰۰,۰۰۰ تومان', desc: 'مدل ۲۰۲۱ - کیت AMG - مشکی آبنوسی', cat: 'cars', img: 'https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&w=800&q=80' }
            ],
            watches: [
                { id: '5', title: 'ساعت رولکس سابمارینر', price: '۴۵۰,۰۰۰,۰۰۰ تومان', desc: 'طلا و استیل - با جعبه و مدارک اصلی', cat: 'watches', img: 'https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=800&q=80' }
            ]
        };

        let currentCategory = 'all';
        let uploadedBase64Img = '';
        let currentUser = localStorage.getItem('zivo_user') || null;

        // وضعیت لاگین اولیه
        updateUserUI();

        // ۲. تغییر تم شب / روز
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');

        themeToggleBtn.onclick = () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            themeIcon.className = isDark ? 'fa-solid fa-moon text-lg text-amber-400' : 'fa-solid fa-sun text-lg text-amber-500';
            localStorage.setItem('zivo_theme', isDark ? 'dark' : 'light');
        };

        if (localStorage.getItem('zivo_theme') === 'light') {
            document.documentElement.classList.remove('dark');
            themeIcon.className = 'fa-solid fa-sun text-lg text-amber-500';
        }

        // ۳. تغییر بین صفحات
        function navigateTo(pageId) {
            document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(pageId);
            if (target) target.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ۴. مدیریت ورود و خروج
        function handleAuthClick() {
            if (currentUser) {
                if (confirm(`آیا می‌خواهید از حساب ${currentUser} خارج شوید؟`)) {
                    currentUser = null;
                    localStorage.removeItem('zivo_user');
                    updateUserUI();
                }
            } else {
                navigateTo('loginPage');
            }
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value.trim();
            currentUser = username;
            localStorage.setItem('zivo_user', username);
            updateUserUI();
            alert(`خوش آمدید ${username}! ورود شما با موفقیت انجام شد.`);
            navigateTo('homePage');
        }

        function updateUserUI() {
            const btnText = document.getElementById('authBtnText');
            if (currentUser) {
                btnText.innerText = currentUser;
            } else {
                btnText.innerText = 'ورود / ثبت‌نام';
            }
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        // ۵. تغییر دسته‌بندی و تعویض محتوا و عکس‌ها
        function switchCategory(catKey, btnEl) {
            currentCategory = catKey;
            
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active-cat'));
            if(btnEl) btnEl.classList.add('active-cat');

            const titleEl = document.getElementById('categoryTitle');
            if (catKey === 'all') titleEl.innerHTML = `<i class="fa-solid fa-border-all"></i> همه آگهی‌ها`;
            else if (catKey === 'digital') titleEl.innerHTML = `<i class="fa-solid fa-mobile-screen"></i> کالای دیجیتال`;
            else if (catKey === 'cars') titleEl.innerHTML = `<i class="fa-solid fa-car"></i> خودروهای لوکس`;
            else if (catKey === 'watches') titleEl.innerHTML = `<i class="fa-solid fa-clock"></i> ساعت‌های خاص`;

            renderProducts();
        }

        // ۶. نمایش کارت‌ها
        function renderProducts(itemsToRender = null) {
            const grid = document.getElementById('productGrid');
            const itemCount = document.getElementById('itemCount');

            let items = [];
            if (itemsToRender) {
                items = itemsToRender;
            } else if (currentCategory === 'all') {
                items = [...database.digital, ...database.cars, ...database.watches];
            } else {
